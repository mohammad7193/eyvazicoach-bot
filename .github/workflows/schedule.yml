name: Eyvazi Coach Automation

on:
  schedule:
    - cron: '45 5 * * *'   # بیداری 9:15 صبح (برای انتشار دقیق در 10:00)
    - cron: '45 8 * * *'   # بیداری 12:15 ظهر (برای انتشار دقیق در 13:00)
    - cron: '45 11 * * *'  # بیداری 15:15 عصر (برای انتشار دقیق در 16:00)
    - cron: '45 14 * * *'  # بیداری 18:15 شب (برای انتشار دقیق در 19:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Automation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: python main.py

      - name: Commit and Push History
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add history.txt
          git commit -m "Update post history [skip ci]" || echo "No changes to commit"
          git push
